<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filipenses no Coração</title>
<style>
  body { margin: 0; background: #0d0d0d; color: #ddd; font-family: system-ui, sans-serif; text-align: center; }
  main { max-width: 420px; margin: 0 auto; padding: 16px; }
  .video { aspect-ratio: 9 / 16; background: #1a1a1a; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #777; font-size: 14px; }
  .botao { display: none; margin: 20px auto 0; padding: 18px; border-radius: 8px; background: #c9a45c; color: #111; font-weight: bold; font-size: 18px; text-decoration: none; }
  .botao.visivel { display: block; }
  footer { padding: 32px 16px; font-size: 13px; color: #888; }
</style>
</head>
<body>
<main>
  <div class="video">[vídeo da aula]</div>
  <a class="botao" id="botao" href="#CHECKOUT">Quero memorizar Filipenses</a>
</main>
<footer>© Filipenses no Coração · Abner Gonzales</footer>
<script>
  // Segundos até o botão aparecer.
  // PROVISÓRIO: por enquanto conta desde o carregamento da página;
  // depois vai ser ligado ao tempo assistido do vídeo real.
  var TEMPO_BOTAO_SEGUNDOS = 10;
  setTimeout(function () {
    document.getElementById('botao').classList.add('visivel');
  }, TEMPO_BOTAO_SEGUNDOS * 1000);
</script>
</body>
</html>
